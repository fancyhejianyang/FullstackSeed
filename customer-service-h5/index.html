<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0B0F14" />
  <title>AI 客服</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/reception.css" />
</head>
<body>
  <!-- 顶部栏 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
          </svg>
        </span>
        <div class="brand-text">
          <h1 class="brand-title">AI 客服</h1>
          <p class="brand-status">
            <span class="status-dot"></span><span id="connection-status">正在连接…</span>
          </p>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-history" class="btn-icon" type="button" aria-label="历史会话" title="历史会话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
        </button>
        <button id="btn-new-chat" class="btn-icon" type="button" aria-label="发起新聊天" title="新聊天">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 消息区（内容由 JS 动态渲染） -->
  <main id="message-list" class="message-list" aria-live="polite"></main>

  <!-- 输入区 -->
  <footer class="input-bar">
    <div class="service-bar" aria-live="polite">
      <span id="service-status">正在创建会话…</span>
      <div class="service-actions">
        <button id="btn-cancel-wait" class="service-button" type="button" hidden>取消等待</button>
        <button id="btn-handoff" class="service-button" type="button" disabled>转人工</button>
        <button id="btn-resume-ai" class="service-button" type="button" hidden>返回 AI</button>
        <button id="btn-retry" class="service-button" type="button" hidden>重试</button>
      </div>
    </div>
    <div id="service-error" class="service-error" role="alert" hidden></div>
    <div class="input-wrap">
      <textarea id="chat-input" rows="1" maxlength="10000" placeholder="输入消息…" aria-label="消息输入框" disabled></textarea>
      <button id="btn-send" class="btn-send" type="button" aria-label="发送" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13" />
          <path d="M22 2 15 22l-4-9-9-4 20-7z" />
        </svg>
      </button>
    </div>
  </footer>

  <!-- 历史会话抽屉 -->
  <div id="history-mask" class="history-mask"></div>
  <aside id="history-panel" class="history-panel" aria-hidden="true">
    <div class="history-header">
      <h2>历史会话</h2>
      <button id="btn-close-history" class="btn-icon" type="button" aria-label="关闭历史会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="history-list" class="history-list"></div>
  </aside>

  <script src="./js/receptionApi.js" defer></script>
  <script src="./js/receptionStore.js" defer></script>
  <script src="./js/reception.js" defer></script>
</body>
</html>
